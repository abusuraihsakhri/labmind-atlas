name: LabMind CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install ruff
      - name: Lint gateway
        run: ruff check gateway/ --select E,F,W --ignore E501
      - name: Lint agents
        run: ruff check agents/ --select E,F,W --ignore E501

  lint-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Type check
        working-directory: web
        run: npx tsc --noEmit

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Build
        working-directory: web
        run: npm run build

  build-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build gateway Docker image
        run: docker build -t labmind-gateway ./gateway

  build-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build agents Docker image
        run: docker build -t labmind-agents ./agents

  test-pages-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify deterministic sandbox
        run: node --test docs/tests/engine.test.mjs

  check-python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python code
        run: python -m compileall -q gateway agents simulator

  test-event-ingestion-postgres:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: labmind_ci
          POSTGRES_PASSWORD: labmind_ci_only
          POSTGRES_DB: labmind_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labmind_ci -d labmind_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://labmind_ci:labmind_ci_only@localhost:5432/labmind_ci
      LABMIND_TEST_DATABASE_URL: postgresql://labmind_ci:labmind_ci_only@localhost:5432/labmind_ci
      LABMIND_TEST_REDIS_URL: redis://localhost:6379/0
      AUDIT_SECRET_KEY: test-audit-secret-key-ci-only
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal agent test dependencies
        run: |
          python -m pip install pytest==8.2.2 sqlalchemy==2.0.30 psycopg2-binary==2.9.9 alembic==1.13.1 pydantic==2.7.4 redis==5.0.5 prometheus-client==0.21.0 fastapi==0.111.0
      - name: Apply baseline and workflow-outbox migrations
        run: |
          cd agents
          python -m alembic upgrade head
      - name: Run PostgreSQL and Redis integrity, recovery and outbox tests
        run: python -m pytest -q agents/tests/test_ingestion_integrity.py agents/tests/test_pipeline_ack.py agents/tests/test_recovery_integration.py
